[project]
name = "aistudyassist-api"
version = "0.1.0"
description = "HTTP API — auth, CRUD, job submission, SSE fan-out (TD §1)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/api"]
