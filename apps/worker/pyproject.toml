[project]
name = "aistudyassist-worker"
version = "0.1.0"
description = "Celery workers — ingest, generation, audio (TD §1)"
requires-python = ">=3.12"
dependencies = [
    "celery>=5.4",
    "redis>=5.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/worker"]
